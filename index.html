<style>
:root{--bg:#12182d;--fg:#ffffff;--card:#1b2444;--mut:#9aa6c8;--acc:#f0a320;--line:#2c3760;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header h1{font-size:18px;margin:0;line-height:1.2}
header small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px Sora,sans-serif;padding:10px 2px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:#12182d}
.dial{margin:20px auto;width:min(74vw,290px);aspect-ratio:1;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;text-align:center;padding:14px;transition:background .08s,border-color .08s}
.dial.pulse{background:color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
.time{font-size:clamp(38px,13vw,56px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.ctrl{display:flex;gap:10px}
.ctrl button{flex:1;padding:16px;border-radius:14px;border:0;font:700 17px Sora,sans-serif;cursor:pointer}
#go{background:var(--acc);color:#12182d}
#rst{background:var(--card);color:var(--fg);border:1px solid var(--line);flex:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.row label{font-size:14px}
select,input[type=number],input[type=text]{font:600 15px Sora,sans-serif;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
input[type=number]{width:70px;text-align:center}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.dur{display:flex;align-items:center;gap:6px;font-size:14px}
.btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font:600 14px Sora,sans-serif;cursor:pointer}
.step{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.step .l1{display:flex;gap:8px;margin-bottom:8px}
.step .l1 input{flex:1}
.step .l2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.step .l2 input{width:58px;padding:6px}
.step .l2 select{padding:6px;font-size:13px}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;padding:0 6px}
input[type=range]{flex:1;min-width:0;width:150px;accent-color:var(--acc)}
output{min-width:62px;text-align:right;font-weight:600;font-size:14px}
.dur.rng{flex:1;justify-content:flex-end}
.hint{color:var(--mut);font-size:12px;padding:0 0 6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none}
h2{font-size:14px;margin:0 0 10px}
</style>
</head>

<main>
  <header>
    <svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Logo CARL"><rect x="1" y="1" width="46" height="46" rx="11" fill="#12182d" stroke="#f0a320" stroke-width="2"/><circle cx="39" cy="9" r="4.5" fill="var(--acc)"/><text x="24" y="31" text-anchor="middle" font-family="Sora,system-ui,sans-serif" font-weight="700" font-size="15" fill="#ffffff">CARL</text></svg>
    <h1>Bip &amp; Chrono<small>Bips, chrono, minuteur, séquences</small></h1>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" data-m="chrono" aria-selected="true">Chrono</button>
    <button role="tab" data-m="down" aria-selected="false">Minuteur</button>
    <button role="tab" data-m="seq" aria-selected="false">Séquence</button>
  </div>

  <div class="dial" id="dial"><div><div class="time" id="time">00:00.0</div><div class="sub" id="sub"></div></div></div>
  <div class="ctrl"><button id="rst">Remise à zéro</button><button id="go">Démarrer</button></div>

  <div class="card hide" id="seqCard">
    <h2>Étapes de la séquence</h2>
    <div id="steps"></div>
    <div class="row"><button class="btn" id="add">Ajouter une étape</button>
      <div class="dur"><label for="rd">Nombre de tours</label><input type="number" id="rd" min="1" max="99" value="1"></div></div>
  </div>

  <div class="card">
    <div class="row hide" id="durRow"><label>Durée</label>
      <div class="dur"><input type="number" id="dm" min="0" max="999" value="5" aria-label="Minutes">min
      <input type="number" id="ds" min="0" max="59" value="0" aria-label="Secondes">s</div></div>
    <div class="row" id="ivRow"><label for="iv">Un bip toutes les</label><div class="dur"><input type="number" id="iv" min="1" max="3600" value="10">s</div></div>
    <div class="row"><label for="alert">Signal</label>
      <select id="alert"><option value="snd">Bip</option><option value="vib">Vibration</option><option value="both">Bip + vibration</option></select></div>
    <div class="hint hide" id="vhint">La vibration n'est pas prise en charge par ce navigateur (par exemple Safari sur iPhone).</div>
    <div class="row" id="sndRow"><label for="snd">Son</label>
      <select id="snd">
        <option value="sine">Bip doux</option><option value="square">Bip net</option><option value="triangle">Bip rond</option>
        <option value="sawtooth">Buzzer</option><option value="double">Double bip</option><option value="triple">Triple bip</option>
      </select></div>
    <div class="row" id="frRow"><label for="fr">Tonalité</label><div class="dur rng"><input type="range" id="fr" min="200" max="2000" step="10" value="880"><output id="fro">880 Hz</output></div></div>
    <div class="row"><label for="ln">Durée du signal</label><div class="dur rng"><input type="range" id="ln" min="50" max="600" step="10" value="150"><output id="lno">150 ms</output></div></div>
    <div class="row" id="vlRow"><label for="vl">Volume</label><div class="dur rng"><input type="range" id="vl" min="1" max="100" value="60"><output id="vlo">60 %</output></div></div>
    <div class="row"><label for="fl">Signal 3-2-1 et alarme finale</label><input type="checkbox" id="fl" checked></div>
    <div class="row"><span></span><button class="btn" id="test">Tester le son</button></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const SNDS=[['sine','Bip doux'],['square','Bip net'],['triangle','Bip rond'],['sawtooth','Buzzer'],['double','Double bip'],['triple','Triple bip']];
let mode='chrono',running=false,t0=0,acc=0,last=0,ctx=null,timer=null,lock=null,finished=false,seqIdx=-1,seqK=0;
let steps=[{n:'Effort',m:0,s:30,i:10,snd:'sine'},{n:'Repos',m:0,s:10,i:0,snd:'triangle'}];
const keys=['iv','snd','fr','ln','vl','fl','alert','dm','ds','rd'];
try{const S=JSON.parse(localStorage.getItem('carlbip')||'{}');
  keys.forEach(k=>{const el=$(k);if(S[k]!==undefined){if(el.type==='checkbox')el.checked=S[k];else el.value=S[k]}});
  if(Array.isArray(S.steps)&&S.steps.length)steps=S.steps}catch(e){}
function save(){try{const S={steps};keys.forEach(k=>{const el=$(k);S[k]=el.type==='checkbox'?el.checked:el.value});localStorage.setItem('carlbip',JSON.stringify(S))}catch(e){}}

function renderSteps(){
  const box=$('steps');box.innerHTML='';
  steps.forEach((p,j)=>{
    const d=document.createElement('div');d.className='step';
    d.innerHTML=`<div class="l1"><input type="text" value="" aria-label="Nom de l'étape" placeholder="Nom"><button class="x" aria-label="Supprimer l'étape">×</button></div>
    <div class="l2"><input type="number" min="0" max="999" aria-label="Minutes">min <input type="number" min="0" max="59" aria-label="Secondes">s
    <span>bip toutes les</span><input type="number" min="0" max="3600" aria-label="Intervalle en secondes">s <select aria-label="Son"></select></div>`;
    const [nm,del]=d.querySelectorAll('.l1 > *'),[mi,se,iv]=d.querySelectorAll('.l2 input'),sel=d.querySelector('select');
    nm.value=p.n;mi.value=p.m;se.value=p.s;iv.value=p.i;
    sel.innerHTML=SNDS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');sel.value=p.snd;
    nm.oninput=()=>{p.n=nm.value;save()};mi.oninput=()=>{p.m=+mi.value||0;save();idle()};se.oninput=()=>{p.s=+se.value||0;save();idle()};
    iv.oninput=()=>{p.i=+iv.value||0;save()};sel.onchange=()=>{p.snd=sel.value;save()};
    del.onclick=()=>{if(steps.length>1){steps.splice(j,1);renderSteps();save();idle()}};
    box.appendChild(d)})}
$('add').onclick=()=>{steps.push({n:'Étape '+(steps.length+1),m:0,s:30,i:0,snd:'sine'});renderSteps();save()};

function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(at,type,f,d,v){const c=ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;v=Math.max(v,0.001);
  g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(v,at+0.01);g.gain.setValueAtTime(v,at+Math.max(d-0.03,0.011));g.gain.exponentialRampToValueAtTime(0.0001,at+d);
  o.connect(g).connect(c.destination);o.start(at);o.stop(at+d+0.02)}
const useSnd=()=>$('alert').value!=='vib',useVib=()=>$('alert').value!=='snd';
function buzz(p){try{if(useVib()&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function beep(o={}){const s=o.snd||$('snd').value,d=(o.ln||+$('ln').value||150)/1000;
  if(useSnd()){const c=audio(),f=+(o.fr||$('fr').value)||880,v=($('vl').value/100)*0.6,t=c.currentTime+0.01;
    if(s==='double'||s==='triple'){const n=s==='double'?2:3;for(let i=0;i<n;i++)tone(t+i*(d+0.07),'sine',f,d,v)}else tone(t,s,f,d,v)}
  const n=s==='double'?2:s==='triple'?3:1,ms=Math.min(Math.max(d*1000,60),600),pat=[];for(let i=0;i<n;i++){if(i)pat.push(70);pat.push(ms)}
  buzz(pat);flash()}
function flash(){const d=$('dial');d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),120)}
function alarm(){if(useSnd()){const c=audio(),f=(+$('fr').value||880)*1.25,v=($('vl').value/100)*0.6,t=c.currentTime+0.01;for(let i=0;i<4;i++)tone(t+i*0.35,'square',f,0.25,v)}flash();buzz([300,100,300,100,300,100,300])}

const fmt=ms=>{ms=Math.max(0,ms);const t=Math.floor(ms/100),d=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d};
const total=()=>((+$('dm').value||0)*60+(+$('ds').value||0))*1000;
const dur=p=>((+p.m||0)*60+(+p.s||0))*1000;
const plan=()=>{const R=Math.max(1,+$('rd').value||1),o=[];for(let r=1;r<=R;r++)steps.forEach((s,j)=>o.push({...s,r,R,j}));return o};
const elapsed=()=>acc+(running?performance.now()-t0:0);
const EMPTY=()=>{$('sub').textContent='Ajoutez une durée'};

function done(){finished=true;if($('fl').checked)alarm();else beep();stop();$('time').textContent='00:00.0';$('sub').textContent='Terminé';$('go').textContent='Démarrer'}
function tick(){
  const e=elapsed(),iv=(+$('iv').value||1)*1000;
  if(mode==='seq'){
    const P=plan();let c=0,idx=-1,st=0;
    for(let k=0;k<P.length;k++){const d=dur(P[k]);if(e<c+d){idx=k;st=c;break}c+=d}
    if(idx<0){done();return}
    const p=P[idx],d=dur(p),le=e-st,r=d-le;
    if(idx!==seqIdx){seqIdx=idx;seqK=0;tick.n=null;beep({snd:'double',ln:120})}
    $('time').textContent=fmt(Math.ceil(r/100)*100);
    const nx=P[idx+1];
    $('sub').textContent=`${p.n||'Étape'}, tour ${p.r}/${p.R}`+(nx?`. Ensuite : ${nx.n||'Étape'}`:'. Dernière étape');
    if(p.i>0){const k=Math.floor(le/(p.i*1000));if(k>seqK){seqK=k;if(r>600)beep({snd:p.snd})}}
    if($('fl').checked&&d>4000&&r>0&&r<=3000){const n=Math.ceil(r/1000);if(n!==tick.n){tick.n=n;beep({snd:'sine',fr:(+$('fr').value||880)*1.1,ln:90})}}
  }else if(mode==='down'){
    const r=total()-e;$('time').textContent=fmt(Math.ceil(r/100)*100);
    const k=Math.floor(e/iv);if(k>last){last=k;if(r>600)beep()}
    if($('fl').checked&&r>0&&r<=3000){const n=Math.ceil(r/1000);if(n!==tick.n){tick.n=n;beep({fr:(+$('fr').value||880)*1.1,ln:90})}}
    if(r<=0&&!finished)done();
  }else{
    $('time').textContent=fmt(e);const k=Math.floor(e/iv);if(k>last){last=k;beep()}
  }
}
async function wake(on){try{if(on&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen')}else if(lock){await lock.release();lock=null}}catch(e){}}
function start(){audio();
  if(mode==='down'&&total()<=0)return;
  if(mode==='seq'&&plan().every(p=>dur(p)<=0))return;
  if(finished)reset();
  running=true;t0=performance.now();timer=setInterval(tick,50);$('go').textContent='Pause';wake(true);tick()}
function stop(){if(running)acc+=performance.now()-t0;running=false;clearInterval(timer);wake(false);$('go').textContent='Reprendre'}
function idle(){if(running||acc>0)return;reset()}
function reset(){running=false;clearInterval(timer);acc=0;last=0;seqIdx=-1;seqK=0;finished=false;tick.n=null;wake(false);$('go').textContent='Démarrer';
  if(mode==='down'){$('time').textContent=fmt(total());$('sub').textContent=`Bip toutes les ${$('iv').value} s, alarme à zéro`}
  else if(mode==='seq'){const P=plan(),t=P.reduce((a,p)=>a+dur(p),0);$('time').textContent=fmt(dur(P[0]));$('sub').textContent=`${steps.length} étape(s), ${P[0].R} tour(s), total ${fmt(t).slice(0,5)}`}
  else{$('time').textContent='00:00.0';$('sub').textContent=`Un signal toutes les ${$('iv').value} s`}}
function labels(){$('fro').textContent=$('fr').value+' Hz';$('lno').textContent=$('ln').value+' ms';$('vlo').textContent=$('vl').value+' %'}
function vhint(){$('vhint').classList.toggle('hide',!($('alert').value!=='snd'&&!navigator.vibrate))}
function layout(){const v=$('alert').value==='vib';$('frRow').classList.toggle('hide',v);$('vlRow').classList.toggle('hide',v);$('durRow').classList.toggle('hide',mode!=='down');$('seqCard').classList.toggle('hide',mode!=='seq');
  $('ivRow').classList.toggle('hide',mode==='seq');$('sndRow').classList.toggle('hide',mode==='seq'||v)}

$('go').onclick=()=>running?stop():start();
$('rst').onclick=reset;
$('test').onclick=()=>beep();
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  mode=b.dataset.m;layout();reset()});
keys.forEach(k=>$(k).addEventListener('input',()=>{save();labels();layout();vhint();idle()}));
document.addEventListener('visibilitychange',()=>{if(running&&!document.hidden)wake(true)});
renderSteps();labels();vhint();layout();reset();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
